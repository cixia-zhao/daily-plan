server {
    listen 172.25.63.250:80;
    server_name 120.55.53.215;
    location /.well-known/acme-challenge/ {
        root /var/lib/daily-plan-acme;
        default_type text/plain;
    }
    location / { return 301 https://120.55.53.215$request_uri; }
}
server {
    listen 172.25.63.250:443 ssl;
    server_name 120.55.53.215;
    ssl_certificate /etc/letsencrypt/live/daily-plan-public-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daily-plan-public-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
