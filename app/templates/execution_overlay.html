<div id="execution-overlay" class="execution-overlay{% if records_only|default(false) %} records-only{% endif %}">
<input id="execute-date" type="hidden" value="{{ execution_date|default('') }}">
<button id="execution-controls-fab" class="execution-controls-fab" type="button" aria-expanded="false" aria-controls="execution-controls" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v5l3 2M9 2h6M12 2v3m6 1 2-2"/></svg><span>计时与记录</span></button>
<div id="execution-mini" class="execution-mini" hidden><button id="execution-mini-open" type="button" aria-label="展开计时与记录"><span id="execution-mini-title"></span><span id="execution-mini-clock">00:00:00</span></button><button id="execution-mini-stop" class="primary" type="button" aria-label="停止当前计时">停止</button></div>
<button id="execution-controls-backdrop" class="execution-controls-backdrop" type="button" tabindex="-1" aria-label="收起计时与记录" hidden></button>
<div id="execution-controls" class="execution-controls" role="dialog" aria-labelledby="execution-controls-title" hidden>
  <button id="execution-sheet-handle" class="execution-sheet-handle" type="button" aria-label="收起计时面板"><span></span></button>
  <div class="execution-controls-heading"><h2 id="execution-controls-title">计时与记录</h2><button id="execution-controls-close" class="ghost-button" type="button" aria-label="收起面板"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
  <div class="execution-sheet-body"><p id="execution-records-empty" class="muted" hidden></p>
<section id="execute-current-panel" class="panel execution-current-panel hidden" aria-label="当前执行与计时">
  <div class="execution-current">
    <div class="execution-current-task"><div class="execution-current-heading"><span class="step">当前执行</span></div><span id="execute-active-badge">当前空闲</span></div>
    <div class="execution-clock-control">
      <div class="execution-clock-readout"><span id="execute-clock-caption" class="muted">选择任务开始</span><span id="execute-clock" role="timer" aria-label="本段已进行时间" aria-live="off">00:00:00</span></div>
      <button id="execute-stop" class="ghost-button stop-current" type="button" disabled aria-label="停止计时">停止</button>
    </div>
  </div>
</section>
<div id="execution-support" class="execution-support hidden">
  <div id="execute-goal-progress" class="execution-goal-progress" hidden>
    <div class="execution-goal-caption"><span id="execute-goal-label"></span><span id="execute-goal-status"></span></div>
    <div id="execute-goal-track" class="execution-goal-track" role="progressbar" aria-label="当前项目今日有效时间目标" aria-valuemin="0" aria-valuemax="100"><span id="execute-goal-fill"></span></div>
    <div class="execution-goal-detail"><span class="execution-goal-activity"><span class="execution-goal-signal" aria-hidden="true"><i></i><i></i><i></i></span><span id="execute-goal-activity"></span></span><span id="execute-goal-remaining"></span></div>
  </div>
  <div class="execution-save-note"><span id="execute-record-status" role="status">正在读取记录…</span><span id="execute-review-status">复盘待填写</span></div>
  <p id="execute-reminder-status" class="muted" role="status" hidden></p>
  <div id="execute-operation-feedback" class="operation-feedback" hidden><p id="execute-operation-message" role="status"></p><button id="execute-sync-retry" class="ghost-button" type="button">核对当前记录</button></div>
</div>

<section id="execute-chronology" class="execution-chronology hidden" aria-label="可点选编辑的时间轴"></section>

      <div id="execute-mobile-toolbar" class="execution-mobile-toolbar hidden">
        <button id="quick-correction-open" class="ghost-button execution-quick-open" type="button" disabled>补记刚才</button>
        <button id="mobile-counted-toggle" class="ghost-button" type="button" aria-expanded="false" aria-controls="mobile-counted-panel">分心</button>
        <button id="mobile-interrupt-toggle" class="ghost-button" type="button" aria-expanded="false" aria-controls="mobile-interrupt-panel">休息／事务</button>
        <button id="mobile-return-effective" class="ghost-button" type="button" disabled>切回有效</button>
        <div id="mobile-counted-panel" class="execution-mobile-label-panel hidden" role="group" aria-label="选择分心活动">
          <div id="mobile-counted-label-list" class="pill-list"></div>
        </div>
        <div id="mobile-interrupt-panel" class="execution-mobile-label-panel hidden" role="group" aria-label="选择休息、生活活动或外部打断">
          <div id="mobile-interrupt-label-list" class="pill-list"></div>
        </div>
        <button id="temporary-open" class="ghost-button" type="button">添加活动</button>
      </div>
      <form id="temporary-form" class="record-form hidden">
        <h3>临时添加</h3><p class="muted">不改原计划，也不删除已有记录。添加后可以直接开始。</p>
        <label>活动名称<input name="title" maxlength="100" required></label>
        <label>归入类别<select name="category"></select></label>
        <label>事项类型<select name="task_type"><option value="daily_goal">每日目标</option><option value="habit">习惯</option><option value="todo">具体待办</option></select></label>
        <button class="primary" type="submit">添加活动</button><button class="ghost-button record-cancel" type="button">取消</button>
      </form>
</div>
</div>
<dialog id="word-count-dialog" class="word-count-dialog" aria-labelledby="word-count-title">
  <form id="word-count-form">
    <h3 id="word-count-title">记词数</h3>
    <p id="word-count-date" class="muted"></p>
    <div class="word-count-inputs">
      <label>新学<input name="new_words" type="number" min="0" max="10000" step="1" inputmode="numeric" placeholder="0"></label>
      <label>复习<input name="review_words" type="number" min="0" max="10000" step="1" inputmode="numeric" placeholder="0"></label>
    </div>
    <p id="word-count-status" class="muted" role="status">当天累计，留空按0。</p>
    <div class="word-count-actions"><button id="word-count-delete" class="ghost-button" type="button">清除</button><button id="word-count-close" class="ghost-button" type="button">取消</button><button class="primary" type="submit">保存</button></div>
  </form>
</dialog>

<dialog id="segment-edit-dialog" class="segment-edit-dialog" aria-labelledby="segment-edit-title">
  <div class="segment-dialog-heading"><h2 id="segment-edit-title">编辑时间段</h2><button id="segment-edit-close" type="button" class="ghost-button" aria-label="关闭时间编辑">×</button></div>
  <p id="segment-edit-context" class="muted"></p>
  <div id="segment-edit-content"></div>
  <p id="segment-edit-error" class="form-error" role="alert" hidden></p>
</dialog>

<dialog id="quick-correction-dialog" class="quick-correction-dialog" aria-labelledby="quick-correction-title">
  <form id="quick-correction-form" novalidate>
    <div class="quick-correction-heading"><h3 id="quick-correction-title">补记刚才</h3><button id="quick-correction-close" type="button" class="ghost-button" aria-label="关闭补记">×</button></div>
    <p id="quick-correction-context" class="muted"></p>
    <div class="quick-correction-categories" role="group" aria-label="刚才做了什么"><button type="button" class="ghost-button" data-quick-category="distraction" aria-pressed="false">分心</button><button type="button" class="ghost-button" data-quick-category="life" aria-pressed="false">厕所／生活</button></div>
    <div class="quick-correction-minutes" role="group" aria-label="估计时长">{% for minutes in [1,2,5,10] %}<button type="button" class="ghost-button" data-quick-minutes="{{ minutes }}" disabled>约{{ minutes }}分</button>{% endfor %}</div>
    <div class="quick-correction-custom"><label>其他分钟<input id="quick-correction-custom" type="number" min="1" max="1440" step="1" inputmode="numeric" placeholder="自填" disabled></label><button type="submit" class="primary" disabled>保存</button></div>
    <p class="quick-correction-note muted">划出最近几分钟，标为“补记·估计”；保存后继续原学习。</p>
    <p id="quick-correction-error" class="form-error" role="alert" hidden></p>
  </form>
</dialog>

</div>
