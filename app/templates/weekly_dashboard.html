<section class="weekly-dashboard" aria-label="周复盘数据看板">
  <div class="visual-metrics weekly-visual-metrics">
    <article><span>本周有效学习</span><strong id="weekly-all-effective-time">—</strong><small id="weekly-effective-change"></small></article>
    <article><span>本周分心</span><strong id="weekly-distraction-time">—</strong><small id="weekly-distraction-change"></small></article>
  </div>
  <div class="weekly-detail-grid">
    <section class="weekly-daily-chart"><div class="section-heading weekly-chart-heading"><h2>每日投入</h2><div class="chart-mode-switch" role="group" aria-label="周图表显示方式"><button type="button" data-week-chart="bar" aria-pressed="true">每天投入</button><button type="button" data-week-chart="line" aria-pressed="false">节奏趋势</button></div></div><div id="weekly-day-bars" class="weekly-day-bars"></div></section>

  <div class="weekly-comparison" aria-label="与上周同期比较"><p id="weekly-comparison-summary"></p><small id="weekly-comparison-range"></small></div>

  <section id="weekly-time-summary" class="time-summary-section" aria-label="本周已记录时间去向"></section>
</section>
