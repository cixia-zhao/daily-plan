<section class="panel weekly-summary">
  <div class="section-heading">
    <div><h2 id="weekly-title"><span id="weekly-title-text">本周摘要</span> <span id="weekly-title-range" class="weekly-title-range">正在读取…</span></h2></div>
    <div class="action-buttons"><button id="refresh-weekly-report" class="secondary" type="button">生成 AI 分析</button><button id="copy-chatgpt-prompt" class="ghost-button" type="button">复制给 ChatGPT</button></div>
  </div>
  <p class="muted" id="weekly-status-note">查看数据不会调用 AI；需要时可复制本周事实与 ChatGPT 整理。</p>
  <div class="stack weekly-analysis-grid">
    <article class="analysis-card"><span>调量建议</span><strong id="weekly-load-advice">—</strong></article>
    <article class="analysis-card"><span>主要拖累因素</span><p id="weekly-drag-factors">—</p></article>
    <article class="analysis-card"><span>有效模式</span><p id="weekly-effective-patterns">—</p></article>
    <article class="analysis-card"><span>真实推进判断</span><p id="weekly-real-progress">—</p></article>
    <article class="analysis-card"><span>下周聚焦点</span><p id="weekly-next-focus">—</p></article>
  </div>
</section>
<section class="panel">
  <details class="weekly-details">
    <summary>与 GPT 整理这一周</summary>
    <div class="details-content">
      <div class="actions"><a class="ghost-button link-button" href="/gpt-workbench">打开 GPT 工作台</a></div>
      <label class="review-form">GPT 回复全文<textarea id="weekly-gpt-response" rows="8" placeholder="粘贴 ChatGPT 的周整理回复留档。"></textarea></label>
      <label class="review-form">准备采纳的动作 / 备注<textarea id="weekly-gpt-adopted" rows="5" placeholder="记录下一周准备执行的重点动作。"></textarea></label>
      <p id="weekly-gpt-save-status" class="muted" role="status"></p>
      <div class="actions"><button id="save-weekly-gpt-record" class="secondary" type="button">保存这次 GPT 协作</button></div>
    </div>
  </details>
</section>
<section class="panel">
  <details class="weekly-details">
    <summary>保存与查看周复盘</summary>
    <div class="details-content">
      <label class="review-form">本周最终周复盘<textarea id="weekly-final-report" rows="10" placeholder="整理或粘贴本周最终复盘结论。"></textarea></label>
      <p id="weekly-final-save-status" class="muted" role="status"></p>
      <div class="actions"><button id="save-weekly-report" class="secondary" type="button">保存这周最终周复盘</button></div>
      <div id="weekly-history" class="stack"></div>
    </div>
  </details>
</section>
