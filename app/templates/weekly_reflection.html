<section class="panel weekly-summary">
  <div class="section-heading">
    <div><p class="step">本周</p><h2 id="weekly-title"><span id="weekly-title-text">本周摘要</span> <span id="weekly-title-range" class="weekly-title-range">正在读取…</span></h2></div>
    <div class="action-buttons"><button id="refresh-weekly-report" class="secondary" type="button">刷新本周整理</button><button id="copy-chatgpt-prompt" class="ghost-button" type="button">复制给 ChatGPT</button></div>
  </div>
  <p class="muted" id="weekly-status-note">这里先把本周事实整理出来，再交给 ChatGPT 和你一起往下深聊。</p>
  <div class="stack weekly-analysis-grid">
    <article class="analysis-card"><span>调量建议</span><strong id="weekly-load-advice">—</strong></article>
    <article class="analysis-card"><span>主要拖累因素</span><p id="weekly-drag-factors">—</p></article>
    <article class="analysis-card"><span>有效模式</span><p id="weekly-effective-patterns">—</p></article>
    <article class="analysis-card"><span>真实推进判断</span><p id="weekly-real-progress">—</p></article>
    <article class="analysis-card"><span>下周聚焦点</span><p id="weekly-next-focus">—</p></article>
  </div>
</section>
<section class="panel">
  <details class="weekly-details">
    <summary>与 GPT 整理这一周</summary>
    <div class="details-content">
      <p class="muted">周模板和单日模板统一放到 GPT 工作台管理；这里保留复制与回填。</p>
      <div class="actions"><a class="ghost-button link-button" href="/gpt-workbench">打开 GPT 工作台</a></div>
      <label class="review-form">GPT 回复全文<textarea id="weekly-gpt-response" rows="9" placeholder="把 ChatGPT 的周整理回复整段贴回这里。"></textarea></label>
      <label class="review-form">我准备采用的内容 / 备注<textarea id="weekly-gpt-adopted" rows="6" placeholder="把真正准备采纳的重点、提醒或下一周动作留在这里。"></textarea></label>
      <div class="actions"><button id="save-weekly-gpt-record" class="secondary" type="button">保存这次 GPT 协作</button></div>
    </div>
  </details>
</section>
<section class="panel">
  <details class="weekly-details">
    <summary>保存与查看周复盘</summary>
    <div class="details-content">
      <label class="review-form">本周最终周复盘<textarea id="weekly-final-report" rows="12" placeholder="你可以直接整理这里，也可以把 ChatGPT 给你的版本贴回这里保存。"></textarea></label>
      <div class="actions"><button id="save-weekly-report" class="secondary" type="button">保存这周最终周复盘</button></div>
      <div id="weekly-history" class="stack"></div>
    </div>
  </details>
</section>
